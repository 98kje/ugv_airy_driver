# rslidar_sdk config for RoboSense Airy (values from Airy User Guide: LiDAR 192.168.1.200, PC 192.168.1.102)
# Topics are relative: rslidar_sdk_node is launched in the lidar namespace (e.g. /sensing/lidar/top).
common:
  msg_source: 1                 # 1: online LiDAR, 3: pcap file
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688            # 0 disables IMU
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.1
      max_distance: 60
      use_lidar_clock: false    # host clock until PTP/gPTP sync is set up
      dense_points: true
      ts_first_point: true      # header.stamp = first point time (Autoware time_stamp is relative to it)
      start_angle: 0
      end_angle: 360
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: /home/aw/autoware_data/airy.pcap
    ros:
      ros_frame_id: rs_airy_top                 # must match the URDF link / sensor_frame
      ros_recv_packet_topic: rslidar_packets
      ros_send_packet_topic: rslidar_packets
      ros_send_imu_data_topic: rslidar_imu_data
      ros_send_point_cloud_topic: rslidar_points
      ros_queue_length: 100
